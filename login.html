<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập | BurgerBox</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="index.html">🍔 BURGER<span>BOX</span></a><section class="auth-card"><div class="auth-side"><small>WELCOME BACK</small><h1>Đói bụng?<br>Đăng nhập thôi!</h1><p>Truy cập tài khoản để theo dõi trải nghiệm đặt món của bạn.</p><a href="index.html">← Về trang chủ</a></div><div class="auth-form"><h2>Đăng nhập</h2><p class="muted">Nhập thông tin tài khoản của bạn.</p><form id="loginForm"><label>Email<input id="email" type="email" required placeholder="user@burgerbox.local"></label><label>Mật khẩu<div class="password"><input id="password" type="password" required placeholder="••••••••"><button type="button" id="togglePassword">Hiện</button></div></label><button class="primary" type="submit">Đăng nhập →</button><p id="message" class="message"></p></form><div class="demo"><b>Tài khoản demo</b><span>Khách: user@burgerbox.local / 123456</span><span>Admin: admin@burgerbox.local / admin123</span></div><p class="switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p></div></section></main><script src="js/auth.js"></script><script>if(getSession())location.href=getSession().role==='admin'?'admin.html':'index.html';document.getElementById('togglePassword').onclick=()=>{const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';document.getElementById('togglePassword').textContent=i.type==='password'?'Hiện':'Ẩn'};document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const r=login(document.getElementById('email').value,document.getElementById('password').value);const m=document.getElementById('message');m.textContent=r.message||'';m.className='message '+(r.ok?'success':'error');if(r.ok)setTimeout(()=>location.href=r.user.role==='admin'?'admin.html':'index.html',300)})</script></body></html>
