<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký | BurgerBox</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="index.html">🍔 BURGER<span>BOX</span></a><section class="auth-card"><div class="auth-side"><small>JOIN BURGERBOX</small><h1>Tạo tài khoản<br>và ăn ngon hơn!</h1><p>Lưu trải nghiệm, đơn hàng và sẵn sàng cho những deal tiếp theo.</p><a href="index.html">← Về trang chủ</a></div><div class="auth-form"><h2>Đăng ký</h2><p class="muted">Tạo tài khoản khách hàng mới.</p><form id="registerForm"><label>Họ và tên<input id="name" required minlength="2" placeholder="Nguyễn Văn A"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Mật khẩu<input id="password" type="password" required minlength="6" placeholder="Tối thiểu 6 ký tự"></label><label>Nhập lại mật khẩu<input id="confirm" type="password" required placeholder="Nhập lại mật khẩu"></label><button class="primary" type="submit">Tạo tài khoản →</button><p id="message" class="message"></p></form><p class="switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></div></section></main><script src="js/auth.js"></script><script>document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();const n=name.value.trim(),em=email.value.trim(),p=password.value,c=confirm.value,m=message;if(p!==c){m.textContent='Mật khẩu nhập lại không khớp.';m.className='message error';return}const r=registerUser(n,em,p);m.textContent=r.ok?'Đăng ký thành công! Đang chuyển sang đăng nhập...':r.message;m.className='message '+(r.ok?'success':'error');if(r.ok)setTimeout(()=>location.href='login.html',700)})</script></body></html>
