<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản | BurgerBox</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/account.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">B</span>BURGER<span>BOX</span></a><nav><a href="index.html">Trang chủ</a><a href="index.html#products">Menu</a><a href="index.html#combo">Combo</a></nav><a class="login-link" href="index.html">← Cửa hàng</a></div></header><main class="account-page container"><section class="account-hero"><div><p class="eyebrow">MY BURGERBOX</p><h1>Xin chào, <span id="userName">bạn</span> 👋</h1><p>Quản lý thông tin và theo dõi những đơn hàng gần đây.</p></div><button id="logout" class="btn">Đăng xuất</button></section><div class="account-grid"><section class="account-card"><h2>Thông tin tài khoản</h2><div class="profile"><div class="avatar" id="avatar">B</div><div><h3 id="profileName"></h3><p id="profileEmail"></p><span class="badge">Khách hàng</span></div></div></section><section class="account-card"><div class="card-head"><h2>Đơn hàng của tôi</h2><span id="orderCount"></span></div><div id="orders"></div></section></div></main><footer><div class="container footer-bottom">© 2026 BurgerBox • Assignment Lập trình cơ sở với JavaScript</div></footer><script src="js/auth.js"></script><script src="js/data.js"></script><script>const u=requireAuth('customer');if(u){userName.textContent=u.name;profileName.textContent=u.name;profileEmail.textContent=u.email;avatar.textContent=u.name.charAt(0).toUpperCase();logout.onclick=logout;const all=JSON.parse(localStorage.getItem('burgerbox-orders'))||[],mine=all.filter(o=>o.userId===u.id||o.email===u.email);orderCount.textContent=mine.length+' đơn';orders.innerHTML=mine.length?mine.slice().reverse().map(o=>`<article class="order"><div><b>#${o.id}</b><small>${o.date||''}</small></div><div><strong>${formatPrice(o.total)}</strong><span class="status">${o.status}</span></div></article>`).join(''):'<div class="empty">Bạn chưa có đơn hàng nào. <a href="index.html#products">Đặt món ngay →</a></div>'}</script></body></html>
